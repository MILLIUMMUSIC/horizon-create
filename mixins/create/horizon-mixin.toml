[mod]
id = "create"
version = "0.1.0"
priority = 100

# Pinned to the Nightly it was built and tested on (2026-10-31). The draw
# hook targets a game function outside the native hook points, so the mod
# pins a commit instead of naming a hooks API.
[compatibility]
horizon_revision = "aa27eca326db26e999d4e59d7899576016764b1e"

[[module]]
id = "kinetics"
file = "crates/horizon-client/src/game.rs"
name = "create_kinetics"
source = "kinetics.rs"

[[module]]
id = "processing"
file = "crates/horizon-client/src/game.rs"
name = "create_processing"
source = "processing.rs"

[[module]]
id = "machines"
file = "crates/horizon-client/src/game.rs"
name = "create_machines"
source = "machines.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "create_glue"
source = "glue.rs"

[[injection]]
id = "level-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_level_tick_post"
helper = "level_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

[[injection]]
id = "block-changed"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_block_changed"
helper = "block_changed.rs"
bindings = [
  { name = "dimension", ty = "horizon_world::level::Dimension", value = "dimension" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
  { name = "old", ty = "horizon_world::registry::BlockStateId", value = "old" },
  { name = "new", ty = "horizon_world::registry::BlockStateId", value = "new" },
]

[[injection]]
id = "placed"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_place_block"
helper = "placed.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
]

[[injection]]
id = "right-click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_right_click_block"
helper = "right_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "world-phase"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_world_lifecycle"
helper = "world_phase.rs"
bindings = [
  { name = "phase", ty = "crate::game::native_lifecycle::WorldPhase", value = "phase" },
]

[[injection]]
id = "from-server"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_net_from_server"
helper = "from_server.rs"
bindings = [
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

[[injection]]
id = "draw"
kind = "HEAD"
target = "horizon_client::game::transient_blocks::Game<'_>::transient_block_geometry"
helper = "draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "out", ty = "&mut Vec<horizon_client::mesher::Vertex>", value = "&mut *out" },
]

[[injection]]
id = "goggles"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "goggles.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

[[injection]]
id = "block-entity"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "block-entity-ticks"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_ticks"
helper = "block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "block-entity-container"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_container"
helper = "block_entity_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "block-entity-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_tick"
helper = "block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]
